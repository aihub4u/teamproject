<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BA Team Analytics — Karix</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#07112A;
  --navy-2:#0D1E3F;
  --navy-3:#142754;
  --blue:#0057FF;
  --blue-hover:#0047D4;
  --blue-light:rgba(0,87,255,0.12);
  --blue-border:rgba(0,87,255,0.3);
  --white:#FFFFFF;
  --off-white:#F4F6FB;
  --card:#FFFFFF;
  --text:#0D1E3F;
  --text-sec:#5B6B8A;
  --text-muted:#8A9AB8;
  --border:rgba(13,30,63,0.10);
  --border-strong:rgba(13,30,63,0.18);
  --radius:10px;
  --radius-lg:14px;
  --shadow:0 1px 4px rgba(7,17,42,0.08),0 4px 16px rgba(7,17,42,0.06);
  --shadow-sm:0 1px 3px rgba(7,17,42,0.07);
}
body{font-family:'Inter',sans-serif;background:var(--off-white);color:var(--text);font-size:14px;line-height:1.55;min-height:100vh;}

/* ── TOPBAR ── */
.topbar{background:var(--navy);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.25);}
.topbar-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-mark{width:30px;height:30px;background:var(--blue);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;letter-spacing:-0.5px;}
.logo-text{font-weight:700;font-size:16px;color:#fff;letter-spacing:-0.02em;}
.logo-sub{font-size:11px;color:rgba(255,255,255,0.45);font-weight:400;margin-left:2px;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.topbar-pill{font-size:11px;color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.08);border:0.5px solid rgba(255,255,255,0.15);border-radius:20px;padding:4px 11px;display:flex;align-items:center;gap:5px;}
.topbar-pill i{font-size:13px;color:#4ADE80;}
.dl-btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background 0.15s,transform 0.1s;font-family:'Inter',sans-serif;}
.dl-btn:hover{background:var(--blue-hover);}
.dl-btn:active{transform:scale(0.97);}
.dl-btn i{font-size:15px;}

/* ── PAGE ── */
.page{max-width:1040px;margin:0 auto;padding:1.75rem 1.5rem 4rem;}

/* ── PAGE HEADER ── */
.page-header{margin-bottom:1.5rem;}
.page-header h1{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-0.03em;}
.page-header p{font-size:13px;color:var(--text-sec);margin-top:4px;}
.header-row{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;}

/* ── FILTER BAR ── */
.filter-bar{display:flex;align-items:center;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap;}
.filter-label{font-size:12px;font-weight:500;color:var(--text-sec);margin-right:2px;}
.chip{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border-strong);background:var(--white);color:var(--text-sec);transition:all 0.15s;white-space:nowrap;font-family:'Inter',sans-serif;box-shadow:var(--shadow-sm);}
.chip:hover:not(.active){background:var(--blue-light);border-color:var(--blue-border);color:var(--blue);}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 2px 8px rgba(0,87,255,0.3);}
.info-pill{font-size:11px;color:var(--text-muted);background:var(--off-white);border:1px solid var(--border);border-radius:20px;padding:4px 11px;}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px;margin-bottom:1.5rem;}
.kpi{background:var(--card);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border);box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--blue);border-radius:3px 0 0 3px;}
.kpi-label{font-size:11px;font-weight:500;color:var(--text-sec);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.04em;}
.kpi-value{font-size:26px;font-weight:700;color:var(--text);letter-spacing:-0.03em;line-height:1.1;}
.kpi.accent .kpi-value{color:var(--blue);}

/* ── TABS ── */
.tab-bar{display:flex;gap:2px;margin-bottom:1.25rem;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:4px;width:fit-content;box-shadow:var(--shadow-sm);}
.tab{padding:7px 18px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text-sec);border-radius:7px;transition:all 0.15s;font-family:'Inter',sans-serif;}
.tab.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(0,87,255,0.25);}
.tab:hover:not(.active){background:var(--off-white);color:var(--text);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── SECTION TITLE ── */
.section-title{font-size:11px;font-weight:600;color:var(--text-sec);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.06em;display:flex;align-items:center;gap:6px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* ── TABLES ── */
.table-wrap{overflow-x:auto;margin-bottom:1.5rem;border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);}
thead{position:sticky;top:0;z-index:2;}
th{text-align:left;padding:10px 14px;font-size:11px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--off-white);text-transform:uppercase;letter-spacing:0.04em;}
th.num{text-align:center;}
th.mhdr{background:var(--navy);color:rgba(255,255,255,0.7);font-size:11px;border-left:2px solid rgba(255,255,255,0.1);text-align:center;padding:10px 12px;}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap;}
td.num{text-align:center;}
td.mcell{border-left:2px solid var(--border);text-align:center;font-size:12px;color:var(--text-muted);}
td.mcell.hi{color:var(--text);font-weight:600;}
td.mcell.zero{color:var(--border-strong);}
tr.total-row td{font-weight:700;background:linear-gradient(90deg,rgba(0,87,255,0.05),rgba(0,87,255,0.02));}
tr.total-row td.mcell{background:transparent;}
tbody tr:hover td{background:rgba(0,87,255,0.03);}
tr:last-child td{border-bottom:none;}
.region-badge{display:inline-flex;align-items:center;gap:5px;font-weight:600;}
.rdot{width:7px;height:7px;border-radius:50%;display:inline-block;}

/* ── CHART GRID ── */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:1.5rem;}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.1rem 1.25rem;box-shadow:var(--shadow-sm);}
.chart-card .section-title{margin-bottom:10px;}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;font-size:11px;color:var(--text-sec);}
.legend span{display:flex;align-items:center;gap:5px;font-weight:500;}
.ldot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}

/* ── FOOTER ── */
.footer{text-align:center;font-size:12px;color:var(--text-muted);margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:8px;}
.footer img{height:18px;opacity:0.5;}

/* ── RESPONSIVE ── */
@media(max-width:640px){
  .chart-grid{grid-template-columns:1fr;}
  .topbar{padding:0 1rem;}
  .page{padding:1.25rem 1rem 3rem;}
  .kpi-value{font-size:22px;}
}

/* ── DRILL-DOWN DRAWER ── */
.drawer-overlay{position:fixed;inset:0;background:rgba(7,17,42,0.45);z-index:200;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.drawer-overlay.open{opacity:1;pointer-events:all;}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(780px,95vw);background:#fff;z-index:201;transform:translateX(100%);transition:transform 0.3s cubic-bezier(0.32,0,0.15,1);display:flex;flex-direction:column;box-shadow:-4px 0 32px rgba(7,17,42,0.18);}
.drawer.open{transform:translateX(0);}
.drawer-header{background:var(--navy);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.drawer-title{color:#fff;font-weight:600;font-size:15px;letter-spacing:-0.01em;}
.drawer-subtitle{color:rgba(255,255,255,0.5);font-size:12px;margin-top:2px;}
.drawer-close{background:rgba(255,255,255,0.1);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;transition:background 0.15s;flex-shrink:0;}
.drawer-close:hover{background:rgba(255,255,255,0.2);}
.drawer-actions{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--off-white);}
.drawer-count{font-size:12px;color:var(--text-sec);}
.drawer-dl{background:var(--blue);color:#fff;border:none;border-radius:7px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;transition:background 0.15s;}
.drawer-dl:hover{background:var(--blue-hover);}
.drawer-body{overflow-y:auto;flex:1;padding:0;}
.drawer-table-wrap{overflow-x:auto;}
.drawer-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.drawer-table th{text-align:left;padding:9px 14px;font-size:10px;font-weight:600;color:var(--text-sec);border-bottom:1px solid var(--border);background:var(--off-white);text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;position:sticky;top:0;z-index:1;}
.drawer-table td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top;max-width:240px;white-space:normal;word-break:break-word;line-height:1.45;}
.drawer-table td.nowrap{white-space:nowrap;max-width:none;}
.drawer-table tbody tr:hover td{background:rgba(0,87,255,0.03);}
.drawer-table tr:last-child td{border-bottom:none;}
.status-pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;}
.sp-live{background:#D1FAE5;color:#065F46;}
.sp-uat{background:#DBEAFE;color:#1E40AF;}
.sp-inprogress{background:#FEF3C7;color:#92400E;}
.sp-scoping{background:#F3E8FF;color:#6B21A8;}
.sp-yts{background:#F1F5F9;color:#475569;}
.sp-unknown{background:#F1F5F9;color:#6B7280;}
.drill-num{cursor:pointer;color:var(--blue);font-weight:600;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;transition:color 0.1s;}
.drill-num:hover{color:var(--blue-hover);}
.drill-num.zero{color:var(--text-muted);cursor:default;text-decoration:none;font-weight:400;}
.kpi.clickable{cursor:pointer;transition:box-shadow 0.15s,transform 0.1s;}
.kpi.clickable:hover{box-shadow:0 4px 16px rgba(0,87,255,0.18);transform:translateY(-1px);}

</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <a class="topbar-logo" href="https://www.karix.com" target="_blank">
    <div class="logo-mark">K</div>
    <div>
      <span class="logo-text">Karix</span>
      <span class="logo-sub">a Tanla company</span>
    </div>
  </a>
  <div class="topbar-right">
    <span class="topbar-pill"><i class="ti ti-circle-check"></i> Live · 27 May 2026</span>

  </div>
</div>

<!-- DRILL-DOWN DRAWER -->

</div>

<!-- PAGE -->
<div class="page">
  <div class="header-row">
    <div class="page-header">

  <div class="tab-bar">

    <button class="tab"        data-tab="monthly" onclick="switchTab('monthly')">Month-wise analytics</button>

  <!-- TAB 1: REGION -->

        <p class="section-title">Projects by region</p>

          <span><span class="ldot" style="background:#0057FF"></span>Total</span>
          <span><span class="ldot" style="background:#10B981"></span>Go live</span>
          <span><span class="ldot" style="background:#F59E0B"></span>In progress</span>
          <span><span class="ldot" style="background:#EF4444"></span>UAT</span>
        </div>
        <div style="position:relative;width:100%;height:220px;"><canvas id="chart1"></canvas></div>
      </div>
      <div class="chart-card">
        <p class="section-title">Development type by region</p>
        <div class="legend">
          <span><span class="ldot" style="background:#6366F1"></span>Twixor</span>
          <span><span class="ldot" style="background:#8B9AB8"></span>Inhouse</span>
        </div>
        <div style="position:relative;width:100%;height:220px;"><canvas id="chart2"></canvas></div>
      </div>
    </div>
    <div class="chart-grid">
      <div class="chart-card">
        <p class="section-title">Overall status mix</p>
        <div style="position:relative;width:100%;height:240px;"><canvas id="chart3"></canvas></div>
      </div>
      <div class="chart-card">
        <p class="section-title">Mandays saved by region</p>
        <div style="position:relative;width:100%;height:240px;"><canvas id="chart4"></canvas></div>
      </div>
    </div>
  </div>

  <!-- TAB 2: MONTHLY -->
  <div class="tab-panel" id="panel-monthly">
    <p class="section-title">Month-wise summary</p>
    <div class="table-wrap" id="month-table-wrap"></div>
    <div class="chart-grid" style="margin-top:0.5rem">
      <div class="chart-card">
        <p class="section-title">Project counts by month</p>
        <div class="legend">
          <span><span class="ldot" style="background:#0057FF"></span>Total</span>
          <span><span class="ldot" style="background:#10B981"></span>Go live</span>
          <span><span class="ldot" style="background:#F59E0B"></span>In progress</span>
          <span><span class="ldot" style="background:#EF4444"></span>UAT</span>
        </div>
        <div style="position:relative;width:100%;height:260px;"><canvas id="trend1"></canvas></div>
      </div>
      <div class="chart-card">
        <p class="section-title">Twixor vs Inhouse trend</p>
        <div class="legend">
          <span><span class="ldot" style="background:#6366F1"></span>Twixor</span>
          <span><span class="ldot" style="background:#8B9AB8"></span>Inhouse</span>
        </div>
        <div style="position:relative;width:100%;height:260px;"><canvas id="trend2"></canvas></div>
      </div>
    </div>
    <div class="chart-card" style="margin-bottom:1.5rem">
      <p class="section-title">Mandays saved trend</p>
      <div class="legend"><span><span class="ldot" style="background:#10B981"></span>Mandays saved</span></div>
      <div style="position:relative;width:100%;height:200px;"><canvas id="trend3"></canvas></div>
    </div>
  </div>

  <div class="footer">
    <span>© 2026 Karix — a Tanla Platforms company</span>
    <span>·</span>
    <span>BA Team Project Analytics</span>
    <span>·</span>
    <span>Data filtered: Apr 2026 onwards</span>
  </div>
</div>

/* ═══════════════════════════════════════════════  KPI  */
function renderKPI(data){
  const t=data['Total'];
  const kpiDefs=[
    ['Total projects',t.total,true,'all','all'],
    ['Go live',t.golive,false,'all','golive'],
    ['In progress',t.inprogress,false,'all','inprogress'],
    ['UAT',t.uat,false,'all','uat'],
    ['Yet to start',t.yts,false,'all','yts'],
    ['Pipeline / scoping',t.scoping,false,'all','scoping'],
    ['Twixor',t.twixor,false,'all','twixor'],
    ['Inhouse',t.inhouse,false,'all','inhouse'],
    ['Mandays saved',t.mandays,false,'all','mandays'],
  ];
  document.getElementById('kpi-grid').innerHTML=kpiDefs.map(([l,v,acc,region,field])=>{
    const clickable=v>0&&field!=='mandays';
    return`<div class="kpi${acc?' accent':''}${clickable?' clickable':''}" ${clickable?`onclick="openDrawer('${region}','${field}','${l}',currentMonthKey)"`:''}>
      <div class="kpi-label">${l}</div>
      <div class="kpi-value">${v}</div>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════  MONTH TABLE  */
function renderMonthTable(){
  const fields=['total','inprogress','uat','golive','yts','scoping','twixor','inhouse','mandays'];
  const labels=['Projects','In progress','UAT','Go live','Yet to start','Scoping / pipeline','Twixor','Inhouse','Mandays saved'];
  const fieldKeys=['all','inprogress','uat','golive','yts','scoping','twixor','inhouse','mandays'];
  const gt=DB.all['Total'];
  const hdrs=ALL_MONTHS.map(k=>`<th class="mhdr">${mLabel(k)}</th>`).join('')+`<th class="mhdr" style="background:#07112A;color:#fff;">Total</th>`;
  const rows=fields.map((f,fi)=>{
    const fk=fieldKeys[fi];
    const cells=ALL_MONTHS.map(k=>{
      const v=DB.months[k].data['Total'][f];
      const canDrill=v>0&&fk!=='mandays';
      return`<td class="mcell${v>0?' hi':' zero'}">${canDrill?`<span class="drill-num" onclick="openDrawer('all','${fk}','${labels[fi]} — ${mLabel(k)}','${k}')">${v}</span>`:v}</td>`;
    }).join('');
    const tv=gt[f];
    const canDrillTotal=tv>0&&fk!=='mandays';
    return`<tr><td><strong>${labels[fi]}</strong></td>${cells}<td class="mcell hi" style="font-weight:700">${canDrillTotal?`<span class="drill-num" onclick="openDrawer('all','${fk}','${labels[fi]} — All Months','all')">${tv}</span>`:tv}</td></tr>`;
  }).join('');
  document.getElementById('month-table-wrap').innerHTML=`<table>
    <thead><tr><th style="min-width:165px">Metric</th>${hdrs}</tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function switchTab(tab){

/* ═══════════════════════════════════════════════  DRAWER  */
let drawerRows=[];

function statusPill(s){
  if(!s||s==='') return'<span class="status-pill sp-unknown">—</span>';
  const sl=s.toLowerCase().trim();
  let cls='sp-unknown';
  if(['live','hypercare','end of life','livebot'].includes(sl)) cls='sp-live';
  else if(sl==='uat') cls='sp-uat';
  else if(['in progress','development','in-progress','in progress '].includes(sl)) cls='sp-inprogress';
  else if(sl.includes('yet to start')) cls='sp-yts';
  else if(['pipeline','scoping','feasibility'].some(k=>sl.includes(k))) cls='sp-scoping';
  return`<span class="status-pill ${cls}">${s}</span>`;
}

function filterRawRows(region, field, monthKey){
  const COL={project:0,region:1,usecase:2,ba:3,start:4,due:5,status:6,progress:7,dev:8,mandays:9,ongoing:10,comments:11};
  const sl=s=>String(s||'').toLowerCase().trim();

  const matchMonth=(row)=>{
    if(monthKey==='all') return true;
    const [y,m]=monthKey.split('-');
    const inDate=(d)=>{
      if(!d) return false;
      const dt=new Date(d); if(isNaN(dt)) return false;
      return dt.getFullYear()===parseInt(y)&&(dt.getMonth()+1)===parseInt(m);
    };
    return inDate(row[COL.start])||inDate(row[COL.due]);
  };

  const matchRegion=(row)=>{
    if(region==='all') return true;
    return sl(row[COL.region])===region.toLowerCase();
  };

  const matchField=(row)=>{
    if(field==='all') return true;
    const st=sl(row[COL.status]);
    const dev=sl(row[COL.dev]);
    if(field==='golive') return['live','hypercare','end of life','livebot'].includes(st);
    if(field==='inprogress') return['in progress','development','in-progress','in progress '].includes(st);
    if(field==='uat') return st==='uat';
    if(field==='yts') return st.includes('yet to start');
    if(field==='scoping') return['pipeline','scoping','feasibility'].some(k=>st.includes(k));
    if(field==='twixor') return dev.includes('twixor');
    if(field==='inhouse') return dev.includes('inhouse')||dev.includes('ihouse');
    return true;
  };

  return RAW.rows.filter(row=>matchMonth(row)&&matchRegion(row)&&matchField(row));
}

function openDrawer(region, field, label, monthKey){
  drawerRows=filterRawRows(region, field, monthKey||currentMonthKey);
  document.getElementById('drawerTitle').textContent=label;
  const monthStr=monthKey&&monthKey!=='all'?` · ${mLabel(monthKey)}`:'';
  document.getElementById('drawerSubtitle').textContent=`${drawerRows.length} project${drawerRows.length!==1?'s':''}${monthStr}`;
  document.getElementById('drawerCount').textContent=`Showing ${drawerRows.length} project${drawerRows.length!==1?'s':''}`;

  const COL={project:0,region:1,usecase:2,ba:3,start:4,due:5,status:6,progress:7,dev:8,mandays:9,ongoing:10};
  const tbody=document.getElementById('drawerBody');
  tbody.innerHTML=drawerRows.map((row,i)=>`<tr>
    <td class="nowrap" style="color:var(--text-muted);font-size:11px">${i+1}</td>
    <td><strong>${row[COL.project]||'—'}</strong>${row[COL.usecase]?`<div style="font-size:11px;color:var(--text-sec);margin-top:2px">${row[COL.usecase].substring(0,80)}${row[COL.usecase].length>80?'…':''}</div>`:''}</td>
    <td class="nowrap"><span class="region-badge"><span class="rdot" style="background:${REGION_COLORS[row[COL.region]]||'#8B9AB8'}"></span>${row[COL.region]}</span></td>
    <td class="nowrap">${row[COL.ba]||'—'}</td>
    <td class="nowrap">${statusPill(row[COL.status])}</td>
    <td class="nowrap" style="font-size:12px">${row[COL.dev]||'—'}</td>
    <td class="nowrap" style="font-size:12px;color:var(--text-sec)">${row[COL.start]||'—'}</td>
    <td class="nowrap" style="font-size:12px;color:var(--text-sec)">${row[COL.due]||'—'}</td>
    <td class="nowrap" style="font-size:12px">${row[COL.progress]?Math.round(parseFloat(row[COL.progress])*100)+'%':'—'}</td>
    <td class="nowrap" style="font-size:12px">${row[COL.mandays]||'—'}</td>
    <td style="font-size:11px;color:var(--text-sec);min-width:160px">${row[COL.ongoing]||'—'}</td>
  </tr>`).join('');

  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeDrawer(){
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  document.body.style.overflow='';
}

document.addEventListener('keydown',e=>{if(e.key==='Escape') closeDrawer();});

function downloadDrawerExcel(){
  if(!drawerRows.length) return;
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet([RAW.cols,...drawerRows]);
  ws['!cols']=[{wch:20},{wch:10},{wch:40},{wch:12},{wch:12},{wch:14},{wch:18},{wch:10},{wch:14},{wch:14},{wch:30},{wch:40}];
  XLSX.utils.book_append_sheet(wb,ws,'Filtered Projects');
  XLSX.writeFile(wb,`BA_Projects_${document.getElementById('drawerTitle').textContent.replace(/[^a-z0-9]/gi,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

/* ═══════════════════════════════════════════════  EXCEL DOWNLOAD  */
function downloadExcel(){
  const wb=XLSX.utils.book_new();
  const wsData=[RAW.cols,...RAW.rows];
  const ws=XLSX.utils.aoa_to_sheet(wsData);

  /* Column widths */
  ws['!cols']=[{wch:20},{wch:10},{wch:40},{wch:12},{wch:12},{wch:14},{wch:18},{wch:10},{wch:14},{wch:14},{wch:30},{wch:40}];

  /* Header style (bold, navy bg) */
  const hStyle={font:{bold:true,color:{rgb:"FFFFFF"}},fill:{fgColor:{rgb:"07112A"}},alignment:{horizontal:'center'}};
  RAW.cols.forEach((_,i)=>{
    const cell=XLSX.utils.encode_cell({r:0,c:i});
    if(ws[cell]) ws[cell].s=hStyle;
  });

  XLSX.utils.book_append_sheet(wb,ws,'Project Report');

  /* Analytics summary sheet */
  const sumRows=[
    ['Region','Projects','In Progress','UAT','Go Live','Yet to Start','Scoping/Pipeline','Twixor','Inhouse','Mandays Saved'],
    ...REGIONS.map(r=>[r,DB.all[r].total,DB.all[r].inprogress,DB.all[r].uat,DB.all[r].golive,DB.all[r].yts,DB.all[r].scoping,DB.all[r].twixor,DB.all[r].inhouse,DB.all[r].mandays]),
    ['Total',DB.all.Total.total,DB.all.Total.inprogress,DB.all.Total.uat,DB.all.Total.golive,DB.all.Total.yts,DB.all.Total.scoping,DB.all.Total.twixor,DB.all.Total.inhouse,DB.all.Total.mandays]
  ];
  const wsSummary=XLSX.utils.aoa_to_sheet(sumRows);
  wsSummary['!cols']=[{wch:12},{wch:10},{wch:12},{wch:8},{wch:10},{wch:12},{wch:18},{wch:10},{wch:10},{wch:14}];
  XLSX.utils.book_append_sheet(wb,wsSummary,'Analytics Summary');

  XLSX.writeFile(wb,`BA_Project_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
}
